# ビルドしてテストを通し、GitHub Pages へ公開する。
#
# 公開されるのは dist/index.html (全てを同梱した単一ファイル) だけ。
# ソースや node_modules は Pages には載らない。
#
# 【初回のみ手動設定が必要】
#   リポジトリの Settings → Pages → Build and deployment → Source を
#   「GitHub Actions」にしてください。
#   ワークフローの GITHUB_TOKEN では Pages の新規作成ができないため、
#   ここだけは手作業になります (2 回目以降は不要)。
name: GitHub Pages へ公開

on:
  push:
    branches:
      - main
      - claude/guitar-page-excel-manager-slt3ib
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理は同時に 1 つだけ動かす (途中で打ち切らない)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ビルドとテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: エンジンのテスト
        run: npm run test

      - name: ブラウザーのテスト (外部通信 0 件の検証を含む)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: 公開用ファイルの準備
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          # Jekyll の処理を通さない (この HTML をそのまま配信する)
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
